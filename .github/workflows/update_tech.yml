name: 5대 핵심 기술 대시보드 자동 업데이트

on:
  # schedule:
  #   # 프로덕션 서버(/home/ubuntu/KEY_TECH_TREND) cron과 이중 실행 및 빈 DB 덮어쓰기 방지를 위해 비활성화
  #   - cron: '18 0 * * *'
  workflow_dispatch:
    # 깃허브 웹에서 수동으로 작동시킬 때만 사용

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 체크아웃
      uses: actions/checkout@v3

    - name: 파이썬 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install google-generativeai

    - name: 파이프라인 구동 (크롤링 및 AI 분석)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python init_db.py
        python run_pipeline.py

    - name: data.js 무결성 및 역사 데이터 검증 (Fail-Closed Safety Guard)
      run: |
        python -c "
        import json, sys
        try:
            with open('data.js', 'r', encoding='utf-8') as f:
                c = f.read()
            idx = c.find('window.techData =')
            if idx == -1:
                print('FATAL GUARD ERROR: missing \"window.techData =\" marker in data.js')
                sys.exit(1)
            raw_json = c[idx+17:].strip().rstrip(';')
            d = json.loads(raw_json)
            articles = d.get('articles', [])
            cnt = len(articles)
            print(f'SAFETY GUARD: Validating {cnt} articles in data.js')
            if cnt < 1000:
                print(f'FATAL GUARD ERROR: Article count {cnt} is less than threshold 1000. Aborting push.')
                sys.exit(1)
            ids = []
            for i, a in enumerate(articles):
                if 'id' not in a:
                    print(f'FATAL GUARD ERROR: Article index {i} is missing \"id\" property. Aborting push.')
                    sys.exit(1)
                aid = a['id']
                if aid is None:
                    print(f'FATAL GUARD ERROR: Article index {i} has id: null. Aborting push.')
                    sys.exit(1)
                # bool is subclass of int in Python, check bool first
                if isinstance(aid, bool):
                    print(f'FATAL GUARD ERROR: Article index {i} has boolean id: {aid}. Aborting push.')
                    sys.exit(1)
                if isinstance(aid, str):
                    if not aid.strip():
                        print(f'FATAL GUARD ERROR: Article index {i} has empty string id. Aborting push.')
                        sys.exit(1)
                elif isinstance(aid, int):
                    pass
                else:
                    print(f'FATAL GUARD ERROR: Article index {i} has invalid id type {type(aid).__name__}. Aborting push.')
                    sys.exit(1)
                ids.append(aid)
            unique_ids = set(ids)
            if len(unique_ids) != cnt:
                print(f'FATAL GUARD ERROR: Duplicate IDs detected ({cnt} articles, {len(unique_ids)} unique IDs). Aborting push.')
                sys.exit(1)
            print(f'PASS: data.js integrity verified ({cnt} articles, all valid scalar unique non-null IDs). Safe to push.')
        except Exception as e:
            print(f'FATAL GUARD ERROR: Malformed data.js or parse failure: {e}')
            sys.exit(1)
        "

    - name: 깃허브 푸시 (검증 통과 시에만 실행)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data.js
        # 변경사항이 있는 경우에만 커밋 및 푸시
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update tech data [skip ci]" && git push)

name: 5대 핵심 기술 대시보드 자동 업데이트

on:
  schedule:
    # 매일 한국시간 오전 9시(UTC 00:00)에 실행
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write   # 깃허브 웹에서 수동으로도 즉시 작동시킬 수 있게 설정

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 체크아웃
      uses: actions/checkout@v3

    - name: 파이썬 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install google-generativeai

    - name: 파이프라인 구동 (크롤링 및 AI 분석)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python run_pipeline.py

    - name: 업데이트된 파일 저장 및 깃허브 푸시
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data.js tech_monitor.db
        # 변경사항이 있는 경우에만 커밋 및 푸시
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update tech data [skip ci]" && git push)

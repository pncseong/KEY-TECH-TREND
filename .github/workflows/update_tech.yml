name: 5대 핵심 기술 대시보드 자동 업데이트

on:
  # schedule:
  #   # 프로덕션 서버(/home/ubuntu/KEY_TECH_TREND) cron과 이중 실행 및 빈 DB 덮어쓰기 방지를 위해 비활성화
  #   - cron: '18 0 * * *'
  workflow_dispatch:
    # 깃허브 웹에서 수동으로 작동시킬 때만 사용

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 체크아웃
      uses: actions/checkout@v3

    - name: 파이썬 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install google-generativeai

    - name: 파이프라인 구동 (크롤링 및 AI 분석)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python init_db.py
        python run_pipeline.py

    - name: 업데이트된 파일 검증 및 깃허브 푸시 (과거 데이터 손실 방지 가드)
      run: |
        python -c "
        import json, sys
        with open('data.js', 'r', encoding='utf-8') as f:
            c = f.read()
        idx = c.find('window.techData =')
        if idx != -1:
            d = json.loads(c[idx+17:].strip().rstrip(';'))
            cnt = len(d.get('articles', []))
            print(f'Generated articles count: {cnt}')
            if cnt < 1000:
                print('SAFETY GUARD: Article count truncated (< 1000). Aborting push to prevent historical data loss.')
                sys.exit(1)
        " || exit 0
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data.js
        # 변경사항이 있는 경우에만 커밋 및 푸시
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update tech data [skip ci]" && git push)

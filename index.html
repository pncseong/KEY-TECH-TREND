<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>KEY TECH TREND MONITOR - 지능형 기술 투자 대시보드</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- 사이드바 / 헤더 영역 -->
        <header class="main-header">
            <div class="logo-area">
                <i data-lucide="cpu" class="logo-icon"></i>
                <div class="logo-text">
                    <h1>KEY TECH TREND</h1>
                    <span>INTELLIGENT MONITOR</span>
                </div>
            </div>
            <div class="status-info">
                <span class="pulse-indicator"></span>
                <span class="update-label">최근 업데이트:</span>
                <span id="last-updated-time">로딩 중...</span>
            </div>
        </header>

        <!-- 상단 대시보드 요약 정보 (Stats Dashboard) -->
        <section class="stats-container">
            <div class="stat-card total-news">
                <div class="stat-icon-wrapper"><i data-lucide="newspaper"></i></div>
                <div class="stat-details">
                    <h3>수집된 총 정보</h3>
                    <p id="stat-total-count">0</p>
                </div>
            </div>
            <div class="stat-card avg-impact">
                <div class="stat-icon-wrapper"><i data-lucide="zap"></i></div>
                <div class="stat-details">
                    <h3>평균 투자 영향도</h3>
                    <p id="stat-avg-impact">0.0</p>
                </div>
            </div>
            <div class="stat-card commercial-ratio">
                <div class="stat-icon-wrapper"><i data-lucide="shopping-bag"></i></div>
                <div class="stat-details">
                    <h3>상용화 단계 비중</h3>
                    <p id="stat-commercial-ratio">0%</p>
                </div>
            </div>
        </section>

        <!-- 필터 콘솔 컨트롤 영역 -->
        <section class="filter-console">
            <div class="search-box">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" id="search-input" placeholder="키워드, 기사 제목, 관련 주식 티커 검색...">
            </div>
            <div class="filter-controls">
                <div class="slider-group">
                    <label for="impact-slider">최소 영향도 (Impact): <span id="impact-val">1</span>점</label>
                    <input type="range" id="impact-slider" min="1" max="10" value="1">
                </div>
                <div class="select-group">
                    <label for="stage-filter">기술 성숙도:</label>
                    <select id="stage-filter">
                        <option value="all">전체 단계</option>
                        <option value="Laboratory">연구실 (Laboratory)</option>
                        <option value="Pilot">시제품 (Pilot)</option>
                        <option value="Commercial">상용화 (Commercial)</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- 정렬 모드 전환 바 -->
        <section class="sort-bar">
            <div class="sort-tabs">
                <button class="sort-tab active" data-sort-by="impact" id="btn-sort-impact">
                    <i data-lucide="zap"></i> 중요도 순
                </button>
                <button class="sort-tab" data-sort-by="date" id="btn-sort-date">
                    <i data-lucide="clock"></i> 실시간 최신순
                </button>
            </div>
        </section>

        <!-- 카테고리 내비게이션 탭 -->
        <nav class="category-nav">
            <div class="nav-scroll-wrapper" id="category-tabs">
                <!-- 동적으로 카테고리 탭 생성됨 -->
                <button class="tab-btn active" data-category-id="all">
                    <i data-lucide="layers"></i> 전체 분석
                </button>
            </div>
        </nav>

        <!-- 아티클 카드 리스트 영역 -->
        <main class="content-area">
            <div class="articles-grid" id="articles-container">
                <!-- 동적으로 카드 렌더링됨 -->
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>인사이트를 로드하는 중입니다...</p>
                </div>
            </div>
        </main>

        <!-- 하단 푸터 -->
        <footer class="app-footer">
            <p>© 2026 KEY TECH TREND MONITOR. Powered by Gemini AI & Antigravity.</p>
        </footer>
    </div>

    <!-- 스크립트 로드 -->
    <script>
        (function() {
            var script = document.createElement('script');
            // 캐시 강제 차단을 위해 버전 파라미터를 무조건 주입합니다.
            var vParam = '?v=' + new Date().getTime();
            script.src = 'data.js' + vParam;
            script.async = false;
            
            // data.js가 완전히 로드 및 실행된 후 app.js를 로드하여 순서를 보장합니다.
            script.onload = function() {
                var appScript = document.createElement('script');
                appScript.src = 'app.js' + vParam;
                appScript.async = false;
                document.body.appendChild(appScript);
            };
            
            document.head.appendChild(script);
        })();
    </script>
</body>
</html>
